<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tillerman — Transaction Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0C0C0D;--bg2:#131315;--bg3:#1A1A1E;--bg4:#222227;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.11);
  --text:#EDEAE2;--text2:#8E8C84;--text3:#4E4C47;
  --accent:#C8F55A;--accent2:#A8D848;--adim:rgba(200,245,90,.08);--aborder:rgba(200,245,90,.22);
  --blue:#6B9FFF;--bdim:rgba(107,159,255,.09);--red:#FF6E6E;--amber:#F7CA45;
  --ff-d:'Fraunces',Georgia,serif;--ff-b:'DM Sans',sans-serif;--ff-m:'DM Mono',monospace;
  --r:10px;--rl:16px
}
body{background:var(--bg);color:var(--text);font-family:var(--ff-b);font-size:14px;line-height:1.5;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.022) 1px,transparent 1px);background-size:28px 28px}
nav{height:56px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:rgba(12,12,13,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#0C0C0D;display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-weight:500}
.wordmark{font-family:var(--ff-d);font-size:17px;font-weight:500}
.back{padding:7px 14px;border:1px solid var(--border2);border-radius:8px;text-decoration:none;color:var(--text2);font-size:12px}
.back:hover{color:var(--text);border-color:var(--aborder)}
.shell{max-width:1000px;margin:0 auto;padding:32px 28px 60px;position:relative;z-index:1}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
.kicker{font-family:var(--ff-m);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.title{font-family:var(--ff-d);font-size:28px;font-weight:300;letter-spacing:-.6px}
.subtitle{font-family:var(--ff-m);font-size:12px;color:var(--text3);margin-top:5px}
.amount{text-align:right;font-family:var(--ff-d);font-size:32px;font-weight:300;color:var(--accent)}
.status{display:inline-flex;margin-top:6px;padding:3px 8px;border-radius:20px;font:10px var(--ff-m);background:var(--adim);color:var(--accent);border:1px solid var(--aborder)}
.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-family:var(--ff-d);font-size:14px;font-weight:500}
.panel-sub{font:10px var(--ff-m);color:var(--text3)}
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border)}
.detail{background:var(--bg2);padding:15px 18px}
.detail-label{font:10px var(--ff-m);color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.detail-value{font-size:13px;color:var(--text);margin-top:5px;word-break:break-word}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 80px 110px;gap:12px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border)}
.item-row:last-child{border-bottom:none}
.item-name{font-size:13px;font-weight:500}
.item-meta{font:10px var(--ff-m);color:var(--text3);margin-top:2px}
.item-price{text-align:right;font:13px var(--ff-m)}
.assignment{text-align:right;font-size:11px;color:var(--blue)}
.person-row{padding:14px 18px;border-bottom:1px solid var(--border)}
.person-row:last-child{border-bottom:none}
.person-top{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--bdim);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;border:1px solid rgba(107,159,255,.16)}
.person-info{flex:1;min-width:0}
.person-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-detail{font:10px var(--ff-m);color:var(--text3);margin-top:2px}
.person-amount{font:14px var(--ff-m);color:var(--blue)}
.track{height:4px;background:var(--bg4);border-radius:10px;overflow:hidden;margin-top:10px}
.fill{height:100%;background:var(--blue)}
.summary{padding:16px 18px}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:12px;color:var(--text2)}
.sum-row strong{font-family:var(--ff-m);color:var(--text)}
.sum-row.total{border-top:1px solid var(--border);margin-top:7px;padding-top:13px}
.empty{padding:35px 20px;text-align:center;color:var(--text3);font-size:12px}
.actions{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:9px;text-decoration:none;font-size:12px;border:1px solid var(--border2);color:var(--text2);background:var(--bg2)}
.btn:hover{color:var(--text);border-color:var(--aborder)}
.btn.accent{background:var(--accent);color:#0C0C0D;border-color:var(--accent)}
.send-btn{margin-top:10px;width:100%;padding:7px 10px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:11px;font-family:var(--ff-b);cursor:pointer;transition:all .15s}
.send-btn:hover{border-color:var(--aborder);color:var(--accent);background:var(--adim)}

/* SEND / SHARE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rl);width:100%;max-width:420px;padding:22px;animation:fadeUp .25s ease both}
.modal-title{font-family:var(--ff-d);font-size:17px;font-weight:500;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:16px;line-height:1.5}
.modal-preview{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:12px 14px;font-size:12px;color:var(--text2);white-space:pre-wrap;font-family:var(--ff-m);max-height:160px;overflow:auto;margin-bottom:16px}
.modal-btn-row{display:flex;flex-direction:column;gap:8px}
.modal-share-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text);font-size:13px;cursor:pointer;font-family:var(--ff-b);transition:all .15s}
.modal-share-btn:hover{border-color:var(--aborder);color:var(--accent);background:var(--adim)}
.modal-share-btn.primary{background:var(--accent);color:#0C0C0D;border-color:var(--accent)}
.modal-share-btn.primary:hover{background:var(--accent2);color:#0C0C0D}
.modal-share-btn:disabled{opacity:.35;cursor:not-allowed}
.modal-close-btn{margin-top:12px;width:100%;padding:9px;border-radius:8px;background:transparent;border:1px solid var(--border2);color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--ff-b)}
.modal-close-btn:hover{color:var(--text)}
.modal-note{font-size:10px;color:var(--text3);margin-top:14px;line-height:1.5;font-family:var(--ff-m)}

/* TOAST */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(10px);opacity:0;background:var(--bg4);border:1px solid var(--border2);border-radius:10px;padding:10px 20px;font-size:13px;color:var(--text);z-index:1100;transition:all .25s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){
  nav{padding:0 16px}.shell{padding:24px 16px 50px}.grid{grid-template-columns:1fr}.header{flex-direction:column}.amount{text-align:left}.detail-grid{grid-template-columns:1fr}.item-row{grid-template-columns:minmax(0,1fr) 70px}.assignment{grid-column:1/-1;text-align:left}
}
</style>
<!-- ── SUPABASE SDK ── -->
<script type="importmap">
{
  "imports": {
    "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
  }
}
</script>
<script type="module" src="supabase.js"></script>
<!-- ─────────────────────────── -->
</head>
<body>
<nav>
  <a class="logo" href="index.html"><div class="mark">T</div><span class="wordmark">Tillerman</span></a>
  <a class="back" href="index.html">← Dashboard</a>
</nav>

<main class="shell" id="page">
  <div class="empty">Loading transaction…</div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from './supabase.js'

// ── SESSION GUARD ──
const { data: { session } } = await supabase.auth.getSession()
if (!session) {
  window.location.href = 'login.html'
  throw new Error('Redirecting to login')
}

function esc(value=''){
  return String(value)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;')
}

function money(value){
  return '$' + Number(value || 0).toFixed(2)
}

function getId(){
  return new URLSearchParams(window.location.search).get('id')
}

// Fetch the single expense with its items/assignees/splits, joined the same
// way as index.html and expenses.html.
async function fetchExpense(id){
  const { data, error } = await supabase
    .from('expenses')
    .select(`
      id, merchant, total_amount, category, payment_method, card_last4,
      expense_date, created_at, notes, source, receipt_file_name,
      expense_items ( id, name, qty, unit_price, split_type, expense_item_assignees ( contact_id ) ),
      expense_splits ( id, contact_id, amount_owed, paid_amount, contacts ( name, phone, email ) )
    `)
    .eq('id', id)
    .maybeSingle()

  if (error) {
    console.error('Could not load transaction:', error)
    return null
  }
  return data
}

function normalizeExpense(raw){
  const items = (raw.expense_items || []).map(item => ({
    id: item.id,
    name: item.name,
    qty: Number(item.qty),
    unitPrice: Number(item.unit_price),
    splitType: item.split_type || 'mine',
    contactIds: (item.expense_item_assignees || []).map(a => a.contact_id).filter(Boolean)
  }))
  const splits = (raw.expense_splits || []).map(split => ({
    id: split.id,
    contact_id: split.contact_id,
    amount_owed: Number(split.amount_owed),
    paid_amount: Number(split.paid_amount || 0),
    name: split.contacts?.name || 'Unnamed person',
    phone: split.contacts?.phone || '',
    email: split.contacts?.email || ''
  }))
  return {
    id: raw.id,
    merchant: raw.merchant,
    total_amount: Number(raw.total_amount || 0),
    category: raw.category,
    payment_method: raw.payment_method,
    card_last4: raw.card_last4,
    expense_date: raw.expense_date,
    created_at: raw.created_at,
    notes: raw.notes,
    items,
    splits
  }
}

function splitRemaining(split){
  return Math.max(0, Number(split.amount_owed || 0) - Number(split.paid_amount || 0))
}

function getAssignmentLabel(item, contactNameById){
  if(item.splitType === 'mine') return 'You'

  const labels = item.contactIds.map(contactId => {
    const name = contactNameById[contactId] || ''
    return name ? name.trim().charAt(0).toUpperCase() : '?'
  })
  // "theirs" and "split" items both may include the owner implicitly for
  // "split"; there's no separate "me" marker in contactIds, so show "You +"
  // for split items to reflect that the owner shares in it too.
  const unique = [...new Set(labels.filter(Boolean))]
  const prefix = item.splitType === 'split' ? ['You'] : []
  const combined = [...prefix, ...unique]

  if(combined.length === 0){
    return item.splitType === 'theirs' ? 'Other person' : 'Split'
  }
  return combined.join(', ')
}

// ─────────────────────────────────────────────
//  ITEMIZED BILL TEXT (mirrors index.html / expenses.html)
// ─────────────────────────────────────────────
function personItemAmount(item, contactId){
  if (!item.contactIds.includes(contactId)) return null
  if (item.splitType === 'mine') return null

  const total = item.qty * item.unitPrice
  const count = item.splitType === 'theirs' ? item.contactIds.length : item.contactIds.length + 1
  if (!Number.isFinite(total) || count < 1) return null

  return { name: item.name, qty: item.qty, amount: total / count, shared: count > 1 }
}

function buildPersonBill(expense, contactId){
  const matching = expense.splits.filter(s => s.contact_id === contactId && splitRemaining(s) > 0.004)
  if (!matching.length) return null

  const lines = []
  let totalDue = 0, name = ''
  const dateValue = expense.expense_date || expense.created_at
  const date = dateValue ? new Date(dateValue) : null
  const dateText = date && !Number.isNaN(date.getTime())
    ? date.toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}) : ''
  lines.push('', `${expense.merchant || 'Expense'}${dateText ? ' — ' + dateText : ''}`)

  for (const split of matching) {
    name ||= split.name
    const due = splitRemaining(split)
    totalDue += due

    const assigned = expense.items.map(item => personItemAmount(item, contactId)).filter(Boolean)
    if (assigned.length) {
      for (const item of assigned) {
        lines.push(`• ${item.name}${item.qty !== 1 ? ' (qty ' + item.qty + ')' : ''}${item.shared ? ' (your share)' : ''}: $${item.amount.toFixed(2)}`)
      }
    } else {
      lines.push('• Your allocated charge (item details unavailable)')
    }
    if (split.paid_amount > 0) lines.push(`  Already paid: $${split.paid_amount.toFixed(2)}`)
    lines.push(`  Remaining for this expense: $${due.toFixed(2)}`)
  }

  return `Hi ${name}, here is your itemized bill from Tillerman:` + lines.join('\n') + `\n\nTOTAL STILL OWED: $${totalDue.toFixed(2)}`
}

async function copyPersonBill(expense, contactId, button) {
  const message = buildPersonBill(expense, contactId)
  if (!message) { alert('No outstanding charges found for this person.'); return }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(message)
    } else {
      const input = document.createElement('textarea')
      input.value = message
      input.style.cssText = 'position:fixed;left:-9999px;top:0'
      document.body.appendChild(input)
      input.focus(); input.select()
      const copied = document.execCommand('copy')
      input.remove()
      if (!copied) throw new Error('Clipboard unavailable')
    }
    const original = button.textContent
    button.textContent = '✓ Copied!'
    setTimeout(() => { if (button.isConnected) button.textContent = original }, 2200)
  } catch (error) {
    console.error('Could not copy bill:', error)
    window.prompt('Copy this itemized bill:', message)
  }
}

let currentExpense = null

async function render(){
  const id = getId()
  const page = document.getElementById('page')
  const raw = id ? await fetchExpense(id) : null

  if(!raw){
    page.innerHTML = `
      <div class="panel">
        <div class="empty">This transaction could not be found.</div>
      </div>
      <div class="actions"><a class="btn accent" href="index.html">Return to dashboard</a></div>`
    return
  }

  const expense = normalizeExpense(raw)
  currentExpense = expense

  const amount = expense.total_amount
  const unpaid = expense.splits.filter(split => splitRemaining(split) > 0.004)
  const owed = unpaid.reduce((sum, split) => sum + splitRemaining(split), 0)
  const yourShare = Math.max(0, amount - owed)
  const items = expense.items

  const contactNameById = {}
  expense.splits.forEach(split => { contactNameById[split.contact_id] = split.name })

  const maxPerson = Math.max(...unpaid.map(s => splitRemaining(s)), 1)
  const date = new Date(expense.expense_date || expense.created_at || Date.now())
    .toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})
  const payment = expense.payment_method || 'Not specified'
  const last4 = expense.card_last4 || ''
  const paymentDisplay = last4 ? `${payment} •••• ${esc(last4)}` : esc(payment)
  const merchant = expense.merchant || 'Unnamed expense'
  const statusText = owed > 0 ? `${unpaid.length} pending balance${unpaid.length===1?'':'s'}` : 'No outstanding balance'

  const itemHtml = items.length ? items.map(item => {
    const total = item.qty * item.unitPrice
    return `
      <div class="item-row">
        <div>
          <div class="item-name">${esc(item.name || 'Unnamed item')}</div>
          <div class="item-meta">Qty ${item.qty} · ${money(item.unitPrice)} each</div>
        </div>
        <div class="item-price">${money(total)}</div>
        <div class="assignment">${esc(getAssignmentLabel(item, contactNameById))}</div>
      </div>`
  }).join('') : `<div class="empty">This expense does not contain item-level details.</div>`

  const peopleHtml = unpaid.length ? unpaid.map(split => {
    const initials = split.name.split(' ').filter(Boolean).map(w => w[0]).join('').toUpperCase().slice(0,2)
    const remaining = splitRemaining(split)
    const width = Math.max(6, Math.round(remaining / maxPerson * 100))
    return `
      <div class="person-row">
        <div class="person-top">
          <div class="avatar">${esc(initials || '?')}</div>
          <div class="person-info">
            <div class="person-name">${esc(split.name)}</div>
            <div class="person-detail">${split.phone ? esc(split.phone) : 'No phone saved'}</div>
          </div>
          <div class="person-amount">${money(remaining)}</div>
        </div>
        <div class="track"><div class="fill" style="width:${width}%"></div></div>
        <button class="send-btn" type="button" data-send-contact="${esc(split.contact_id)}">Send to ${esc(split.name.split(' ')[0] || split.name)} · Copy bill</button>
      </div>`
  }).join('') : `<div class="empty">This was saved as a personal expense.</div>`

  page.innerHTML = `
    <section class="header">
      <div>
        <div class="kicker">Transaction distribution</div>
        <h1 class="title">${esc(merchant)}</h1>
        <div class="subtitle">${esc(date)} · ${esc(expense.category || 'Other')}</div>
      </div>
      <div>
        <div class="amount">${money(amount)}</div>
        <div class="status">${esc(statusText)}</div>
      </div>
    </section>

    <div class="grid">
      <div>
        <section class="panel">
          <div class="panel-head">
            <div class="panel-title">Items and assignments</div>
            <div class="panel-sub">${items.length} item${items.length===1?'':'s'}</div>
          </div>
          ${itemHtml}
        </section>

        <section class="panel" style="margin-top:16px">
          <div class="panel-head">
            <div class="panel-title">Transaction details</div>
          </div>
          <div class="detail-grid">
            <div class="detail"><div class="detail-label">Merchant</div><div class="detail-value">${esc(merchant)}</div></div>
            <div class="detail"><div class="detail-label">Date</div><div class="detail-value">${esc(date)}</div></div>
            <div class="detail"><div class="detail-label">Payment</div><div class="detail-value">${paymentDisplay}</div></div>
            <div class="detail"><div class="detail-label">Category</div><div class="detail-value">${esc(expense.category || 'Other')}</div></div>
            <div class="detail" style="grid-column:1/-1"><div class="detail-label">Notes</div><div class="detail-value">${esc(expense.notes || 'No notes')}</div></div>
          </div>
        </section>
      </div>

      <div>
        <section class="panel">
          <div class="panel-head">
            <div class="panel-title">Who owes you</div>
            <div class="panel-sub">${unpaid.length} person${unpaid.length===1?'':'s'}</div>
          </div>
          ${peopleHtml}
        </section>

        <section class="panel" style="margin-top:16px">
          <div class="panel-head"><div class="panel-title">Distribution summary</div></div>
          <div class="summary">
            <div class="sum-row"><span>Total transaction</span><strong>${money(amount)}</strong></div>
            <div class="sum-row"><span>Your share</span><strong>${money(yourShare)}</strong></div>
            <div class="sum-row"><span>Still owed to you</span><strong>${money(owed)}</strong></div>
            <div class="sum-row total"><span>Allocated</span><strong>${money(yourShare + owed)}</strong></div>
          </div>
        </section>

        <div class="actions">
          <a class="btn" href="expenses.html?edit=${encodeURIComponent(expense.id)}">Edit transaction</a>
          <a class="btn accent" href="index.html">Done</a>
        </div>
      </div>
    </div>`
}

document.getElementById('page').addEventListener('click', event => {
  const button = event.target.closest('[data-send-contact]')
  if (!button || !currentExpense) return
  copyPersonBill(currentExpense, button.dataset.sendContact, button)
})

render()
</script>
</body>
</html>
